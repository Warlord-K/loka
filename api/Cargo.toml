[package]
name = "loka-api"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
loka-shared = { path = "../shared" }
loka-agent = { path = "../agent" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.6", features = ["cors", "decompression-gzip", "compression-gzip", "compression-br"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
hex = "0.4"
anyhow = "1"
dotenvy = "0.15"
indexmap = { version = "2", features = ["serde"] }
urlencoding = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2", "stream"], default-features = false }
rusty-s3 = "0.7"
url = "2"
ring = "0.17"
futures-util = "0.3"
async-stream = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
